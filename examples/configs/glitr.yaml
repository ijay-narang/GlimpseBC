defaults:
  - main
  - override task: pusht_image
  - override network: glitr
  - _self_

optimization:
  loss_type: regression
  loss_scale: 1.0
  ema_rate: 1.0
  grad_clip_norm: 0.0
  sample_mode: zero
  use_compile: false
  use_cudagraphs: false
  auto_resume: false
  batch_size: 32

log:
  exp_name: "${task.env_name}_${task.env_type}_task${oc.select:task.libero_task_id,0}_${network.network_type}_${network.emb_dim}_seed${optimization.seed}"
  log_dir: "logs/${log.exp_name}"

# Original GLiTR architecture with continuous robot-action supervision.
glitr:
  stage: teacher
  teacher_checkpoint: null
  export_checkpoint: null
  camera_key: null
  backbone: deit_small_patch16_224
  input_size: 224
  num_patches_in_glimpse: 3
  pretrained_dir: null
  drop: 0.0
  drop_path: 0.1
  spatial_loss_weight: 1.0
  temporal_loss_weight: 1.0
  base_lr_backbone: 1.0e-5
  base_lr_temphead: null
  base_lr_temploc: null
  weight_decay: 0.05

network:
  encoder_type: glitr
